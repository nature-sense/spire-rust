[package]
name = "mcp-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for Node.js/npm/pnpm/Yarn project analysis and building"

[[bin]]
name = "mcp-node"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-mcp-sdk = { workspace = true }
rust-mcp-transport = { workspace = true }
rust-mcp-schema = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }

# YAML parsing for pnpm-workspace.yaml
serde_yaml = "0.9"

# File system
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
