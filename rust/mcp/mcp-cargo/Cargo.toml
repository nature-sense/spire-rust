[package]
name = "mcp-cargo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for Rust/Cargo project analysis and building"

[[bin]]
name = "mcp-cargo"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-mcp-sdk = { workspace = true }
rust-mcp-transport = { workspace = true }
rust-mcp-schema = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }

# Cargo metadata parsing
cargo_metadata = "0.19"
toml = "0.8"

# File system
walkdir = "2"
regex = "1"

# Path diff for relative paths
pathdiff = "0.2"

[dev-dependencies]
tempfile = "3"
